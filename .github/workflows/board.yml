name: Board

# The task board: `status:*` labels on issues plus one pinned "Board" issue
# that lists them by column. See `.github/scripts/board.mjs` for the rules and
# CLAUDE.md, "The board", for the columns.
#
#  - Adding a `status:*` label removes the issue's other status labels.
#  - A new issue starts in Backlog; a closed one is Done.
#  - A PR that closes an issue moves it to QA.
#  - Moving an issue to Ready moves it to In progress and runs /ship on it.
#  - Moving an issue back to In progress while its PRs are open (sent back
#    from QA, review or blocked) runs an agent that reworks those PRs.
#
# Uses RESTACK_TOKEN (the same fine-grained PAT restack.yml uses) so its label
# changes trigger other workflows; it falls back to GITHUB_TOKEN.
on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  pull_request:
    types: [opened, ready_for_review, closed]
  schedule:
    # Daily, so "Done this week" ages out even on quiet days.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  status:
    # Never react to the Board issue itself: rewriting it would trigger another render.
    if: >-
      (github.event_name == 'issues' || github.event_name == 'pull_request') &&
      !contains(github.event.issue.labels.*.name, 'board')
    runs-on: ubuntu-latest
    # Per issue/PR and never cancelled: each run applies one event's rule.
    concurrency:
      group: board-status-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    outputs:
      ship: ${{ steps.status.outputs.ship }}
      rework: ${{ steps.status.outputs.rework }}
      rework_prs: ${{ steps.status.outputs.rework_prs }}
    env:
      GH_TOKEN: ${{ secrets.RESTACK_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - id: status
        run: node .github/scripts/board.mjs status

  render:
    needs: status
    # Runs after status, or on its own for schedule/dispatch (status skipped).
    if: >-
      always() && needs.status.result != 'failure' &&
      !contains(github.event.issue.labels.*.name, 'board')
    runs-on: ubuntu-latest
    # Only the latest render matters.
    concurrency:
      group: board-render
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ secrets.RESTACK_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - run: node .github/scripts/board.mjs render

  ship:
    needs: status
    if: needs.status.outputs.ship != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: ship-${{ needs.status.outputs.ship }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Push as the PAT's user: a github-actions[bot] push leaves the PR's
          # CI and preview waiting for manual approval.
          token: ${{ secrets.RESTACK_TOKEN || github.token }}
      - uses: ./.github/actions/claude-env
      - name: Install Chromium for screenshots and browser tests
        run: bunx playwright install --with-deps chromium
      - name: Say on the issue that the run has started
        id: announce
        env:
          GH_TOKEN: ${{ secrets.RESTACK_TOKEN || github.token }}
          ISSUE: ${{ needs.status.outputs.ship }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(printf '%s\n\n%s' "**Picking this up.** ([/ship run]($RUN))" "_Reading the issue and working out a plan; this comment will show it and track progress._")
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" -f body="$body" --jq .id)
          echo "comment=$id" >> "$GITHUB_OUTPUT"
      - name: Ship the issue
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.RESTACK_TOKEN || github.token }}
          show_full_output: true
          prompt: |
            Ship GitHub issue #${{ needs.status.outputs.ship }}, unattended. It was moved to Ready on the board.

            Follow `.claude/skills/ship/SKILL.md`, with one change for this environment: do NOT use the Workflow tool. This is a headless run that ends the moment your turn ends, so a background workflow would be killed before it does anything. Instead run the stages in `.claude/workflows/solid-groove-ship.js` yourself, in order (triage, build, review for features only, land), giving each stage's prompt to the Agent tool with `run_in_background: false` and waiting for its result before starting the next. Read the agent briefs in `.claude/agents/` the same way the workflow does.

            Do not end your turn until the pull requests are open, or the issue is labelled `status:blocked` with a comment saying why. Before you report a PR, confirm it exists with `gh pr view`. Never report a result you have not seen. Use the `gh` CLI for GitHub (GH_TOKEN is set).

            Keep the issue informed through comment ${{ steps.announce.outputs.comment }}, which this run already posted on the issue. Edit it in place (`gh api --method PATCH repos/${{ github.repository }}/issues/comments/${{ steps.announce.outputs.comment }} -f body=...`), keeping its first line and run link: as soon as you have read the issue, replace the placeholder with a short plan as a Markdown checklist; tick items off as each is done; and when you finish, end it with a summary of what changed and links to the PRs, or why you stopped. Do not post separate progress comments.
          claude_args: |
            --model opus
            --max-turns 400
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,LS,TodoWrite,WebFetch,WebSearch,Task,Agent,Skill,ToolSearch,Bash"
        env:
          GH_TOKEN: ${{ secrets.RESTACK_TOKEN || github.token }}
      - name: Check the run actually produced a PR
        # The agent's own report is not evidence: an earlier run ended its turn
        # early and described PRs that did not exist. Trust only GitHub.
        id: verify
        env:
          GH_TOKEN: ${{ secrets.RESTACK_TOKEN || github.token }}
          ISSUE: ${{ needs.status.outputs.ship }}
        run: |
          labels=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          if echo "$labels" | grep -qx 'status:blocked'; then
            echo "Issue was moved to Blocked by the run; nothing to check."; exit 0
          fi
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --search "$ISSUE in:body" --json number,body \
            --jq "[.[] | select(.body | test(\"(?i)(close[sd]?|fix(e[sd])?|resolve[sd]?) #$ISSUE\\\\b\"))] | length")
          if [ "$prs" -gt 0 ]; then echo "Found $prs open PR(s) closing #$ISSUE."; exit 0; fi
          echo "No open PR closes #$ISSUE."; exit 1
      - name: Move the card to Blocked if the run failed
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.RESTACK_TOKEN || github.token }}
          ISSUE: ${{ needs.status.outputs.ship }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "The unattended /ship run stopped before finishing: $RUN"
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label status:blocked --remove-label status:in-progress

  rework:
    needs: status
    if: needs.status.outputs.rework != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Shares /ship's group: never rework an issue while it is being built.
    concurrency:
      group: ship-${{ needs.status.outputs.rework }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Push as the PAT's user: a github-actions[bot] push leaves the PR's
          # CI and preview waiting for manual approval.
          token: ${{ secrets.RESTACK_TOKEN || github.token }}
      - uses: ./.github/actions/claude-env
      - name: Install Chromium for screenshots and browser tests
        run: bunx playwright install --with-deps chromium
      - id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Say on the issue that the run has started
        id: announce
        env:
          GH_TOKEN: ${{ secrets.RESTACK_TOKEN || github.token }}
          ISSUE: ${{ needs.status.outputs.rework }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(printf '%s\n\n%s' "**Picking this up again: it was sent back while its PRs were open.** ([rework run]($RUN))" "_Reading the issue and working out a plan; this comment will show it and track progress._")
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" -f body="$body" --jq .id)
          echo "comment=$id" >> "$GITHUB_OUTPUT"
      - name: Rework the issue's PRs
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.RESTACK_TOKEN || github.token }}
          show_full_output: true
          prompt: |
            GitHub issue #${{ needs.status.outputs.rework }} was sent back to In progress on the board while its PRs were open: ${{ needs.status.outputs.rework_prs }} (the PR that closes it; in a stack, the earlier PRs say `Refs #${{ needs.status.outputs.rework }}`, so find those too). Find out why and do the work. This is a headless run: nobody will answer questions, and it ends when your turn ends, so do not use the Workflow tool or background agents.

            1. If a Claude run is already handling this (an `@claude` comment on one of those PRs in the last 20 minutes, or an in-progress run of the "Claude Code" workflow on one of them: `gh run list --workflow claude.yml --status in_progress`), stop and do nothing.
            2. Read the issue body and every comment on the issue, and on each PR its comments, reviews and review threads. The feedback is whatever the product owner (afternoon) or the QA report said after the PRs were last pushed. If it changes the spec, the issue body and comments are the authority.
            3. Fix it on the existing PR branches, following CLAUDE.md ("Landing work", "Definition of done") and `.claude/agents/solid-groove-implementer.md`. This is not a fresh build: do not open new PRs unless the feedback asks for more work than the stack covers. In a stack, commit to the branch the change belongs on; restack.yml rebases the PRs above it. Never force-push; if a push is rejected because restack moved the branch, `git pull --rebase` and push again. Run `bun run typecheck`, `bun run check`, `bun run test` and any browser suite you touched before pushing. A UI change needs updated screenshots in the PR body.
            4. Reply on each piece of feedback (the review thread, or one comment on the PR) saying what changed, and resolve threads you fixed.
            5. Move the card: `status:qa` if the closing PR has the `deploy-preview` label (the push redeploys it for QA), otherwise `status:review`.

            Stop only if two reasonable readings of the feedback would build materially different things: then comment the one question on the issue and add `status:blocked`. Use the `gh` CLI for GitHub (GH_TOKEN is set). Never report a push you have not seen land.

            Keep the issue informed through comment ${{ steps.announce.outputs.comment }}, which this run already posted on the issue. Edit it in place (`gh api --method PATCH repos/${{ github.repository }}/issues/comments/${{ steps.announce.outputs.comment }} -f body=...`), keeping its first line and run link: as soon as you have read the issue, replace the placeholder with a short plan as a Markdown checklist; tick items off as each is done; and when you finish, end it with a summary of what changed and links to the PRs, or why you stopped. Do not post separate progress comments.
          claude_args: |
            --model opus
            --max-turns 300
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,LS,TodoWrite,WebFetch,WebSearch,Task,Agent,Skill,ToolSearch,Bash"
        env:
          GH_TOKEN: ${{ secrets.RESTACK_TOKEN || github.token }}
      - name: Check the run did something
        # Trust only GitHub: a push to one of the PRs, or the card moved on.
        env:
          GH_TOKEN: ${{ secrets.RESTACK_TOKEN || github.token }}
          ISSUE: ${{ needs.status.outputs.rework }}
          PRS: ${{ needs.status.outputs.rework_prs }}
          SINCE: ${{ steps.start.outputs.at }}
        run: |
          labels=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          if ! echo "$labels" | grep -qx 'status:in-progress'; then
            echo "Card moved on: $(echo "$labels" | grep '^status:')"; exit 0
          fi
          for pr in $PRS; do
            last=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json commits --jq '.commits[-1].committedDate')
            if [[ "$last" > "$SINCE" ]]; then echo "PR #$pr was pushed at $last."; exit 0; fi
          done
          # Step 1 of the prompt stands down for an @claude run already on it.
          recent=$(date -u -d "$SINCE - 20 minutes" +%Y-%m-%dT%H:%M:%SZ)
          for pr in $PRS; do
            n=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json comments \
              --jq "[.comments[] | select(.createdAt > \"$recent\" and (.body | contains(\"@claude\")))] | length")
            if [ "$n" -gt 0 ]; then echo "An @claude run on PR #$pr has it."; exit 0; fi
          done
          echo "No push to $PRS and the card is still In progress."; exit 1
      - name: Move the card to Blocked if the run failed
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.RESTACK_TOKEN || github.token }}
          ISSUE: ${{ needs.status.outputs.rework }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "The unattended rework run stopped before finishing: $RUN"
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label status:blocked --remove-label status:in-progress
