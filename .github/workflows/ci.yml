name: CI

on:
  push:
    # `claude/**` covers the implementation branches the Phase 0 workflow
    # pushes. The review stage runs against a pushed branch *before* a pull
    # request exists, so a `pull_request`-only trigger leaves reviewers with no
    # CI run to read at the moment they have to decide. That is not
    # hypothetical: FND-001's reviewer waived the "browser suite has never
    # executed" finding on the grounds that a green run was structurally
    # unobtainable at review time, and the browser jobs then failed on the
    # first PR run. Building CI on push makes that checkable when it matters.
    branches: [main, "claude/**"]
  pull_request:

# Cancel superseded runs on the same ref so pushes to an open PR don't queue
# up stale checks. `main` is excluded: the `deploy` job below must never be
# cancelled mid-flight (see that job's own `concurrency` block), and a
# workflow-level cancellation would kill `firebase deploy` between its
# rules/indexes release and its Hosting release, leaving production with
# mismatched rules and Hosting code and no failure signal (the run reports
# "cancelled", not "failed").
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Fast, no-external-service gate: typecheck, lint/format check, and the
  # unit + component suites. Everything else depends on this passing first.
  checks:
    name: typecheck, check:ci, unit + component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint and format check (non-mutating)
        run: bun run check:ci
      - name: Configure a null ALSA output device
        # ubuntu-latest has no /dev/snd, so Tone.js's real (non-offline) global
        # AudioContext — created as a side effect of importing "tone" in
        # src/audio/ToneInstrument.test.ts — cannot initialize: node-web-audio-api's
        # cpal backend fails with "DeviceUnavailable" when it queries a default
        # output device and finds none. Installing the ALSA runtime library plus a
        # `null` PCM as the default output device (discards every sample, never
        # touches hardware) gives cpal a device to find, without needing a kernel
        # module (snd-dummy) or real audio hardware.
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64
          cat > ~/.asoundrc <<'EOF'
          pcm.!default {
              type null
          }
          ctl.!default {
              type null
          }
          EOF
      - name: Unit and component tests
        run: bun run test
      - name: Validate the starter sound library
        # Renders all 200 assets and runs the full manifest validation
        # (docs/sample-library.md section 9), including the collection-level
        # coverage and balance rules the unit suite cannot check against the
        # representative sample it renders. Needs no credentials or network.
        run: bun run library:validate

  # Browser end-to-end suite. Chromium and Firefox are the P0 gating
  # browsers (PRD section 10) and fail the workflow. WebKit runs alongside
  # them as a signal only — `continue-on-error` means a WebKit-only failure
  # is reported but never blocks the required checks, per the PRD's
  # supported-environment policy: "WebKit passing is not the same as Safari
  # passing," and the alpha does not gate release on it.
  browser:
    name: browser e2e (${{ matrix.browser }})
    needs: checks
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.browser == 'webkit' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browser (${{ matrix.browser }})
        run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser suite
        run: bunx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  # Firebase Emulator suite: contract tests for firestore.rules against a
  # real local Firestore instance (PRD 9.9).
  emulator:
    name: firebase emulator tests
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Firebase Emulator suite
        run: bun run test:emulator

  # FND-001b (PRD OPS-01): proves the production build itself, and the "no
  # secret reaches the client bundle" check, on every push and PR -- not only
  # when a deploy actually happens. This needs no Firebase project or
  # credentials: `bun run build` and the scanner both run entirely offline, so
  # this job runs unconditionally and gates merges like every other job here.
  # The `deploy` job below runs the same two steps (via `bun run deploy`'s
  # `predeploy` hook) against the real release SHA before shipping anything.
  build:
    name: production build + no-secrets-in-bundle check
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Verify no secret reaches the client bundle
        run: bun run verify:bundle
      # FND-001c (PRD OPS-03 / section 10): the error-monitoring SDK's bundle
      # cost is measured here rather than assumed acceptable. Fails if the SDK
      # ever lands in an eagerly-loaded chunk (i.e. if the dynamic import() in
      # src/telemetry.ts becomes a static one) or if its lazy chunk outgrows
      # the budget declared in the script. Needs no credentials.
      - name: Measure the error-monitoring SDK's bundle cost
        run: bun run verify:budget

  # FND-001b (PRD OPS-01): deploys to the alpha's one hosted environment --
  # the production Firebase project -- from CI on every merge to `main`, never
  # from a developer machine. Rules and indexes deploy from this same pipeline
  # in the same command, so a failing rules/index step fails the deploy
  # instead of shipping application code its deployed rules don't match.
  #
  # Gated on `vars.FIREBASE_PROJECT_ID` (a GitHub Actions repository
  # *variable*, not a secret -- a Firebase project ID is not sensitive, and
  # `vars` is safe to read from an `if:` condition, unlike `secrets`) so this
  # job silently no-ops until the production project and its CI credentials
  # actually exist, rather than failing every merge to `main` in the
  # meantime. Provisioning the project and setting these is tracked outside
  # this repository (this task "provisions no accounts and holds no
  # secrets" -- see docs/testing.md "Deploy" for the full secret/variable
  # list and how to add them).
  deploy:
    name: deploy to Firebase Hosting
    needs: [checks, browser, emulator, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    # A second deploy landing while one is mid-flight must queue behind it,
    # never run concurrently or cancel it: `firebase deploy --only
    # hosting,firestore,storage` is not atomic across tiers, and two
    # overlapping deploys could interleave a Hosting release from one commit
    # with Firestore rules from another.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A service account JSON is CI-only credential material; it exists only
      # for the lifetime of this job's runner and is never checked in (see
      # .gitignore's "secrets" section and .env.example). firebase-tools reads
      # Application Default Credentials from GOOGLE_APPLICATION_CREDENTIALS,
      # which is how it authenticates non-interactively in CI.
      - name: Write the deploy service account credential
        run: printf '%s' "$FIREBASE_DEPLOY_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-deploy-service-account.json"
        env:
          FIREBASE_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      # `bun run deploy` is the one documented command (see README/docs/testing.md):
      # its `predeploy` hook builds and re-verifies the bundle, then this
      # deploys Hosting, Firestore rules/indexes, and Storage rules together,
      # so a failing rules/index step fails the deploy instead of shipping
      # application code its deployed rules don't match. `VITE_RELEASE_SHA`
      # stamps this exact commit into the client build (PRD OPS-01), and every
      # analytics and error event carries it (FND-001c).
      #
      # FND-001c (PRD OPS-03) hooks in through the three `SENTRY_*` values
      # below. They are consumed by app.config.ts's build plugin during this
      # step's `predeploy` build, which is the only point at which the deployed
      # artifacts and their source maps both exist:
      #
      #   - registers the release in Sentry under this exact commit SHA, and
      #   - uploads the source maps for it over an authenticated HTTPS channel,
      #     then deletes them from the build output so `firebase deploy` has no
      #     map to publish (firebase.json also refuses to upload `**/*.map`).
      #
      # All three are optional: with any of them unset the plugin is inactive
      # and the deploy proceeds unchanged, minus symbolication. That keeps this
      # job working before the Sentry project exists, exactly like the Firebase
      # gate above. See .env.example and docs/testing.md "Verifying analytics
      # and errors against a deployed build".
      - name: Build, verify, and deploy
        run: bun run deploy
        env:
          VITE_RELEASE_SHA: ${{ github.sha }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-deploy-service-account.json
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # FND-001c (PRD OPS-03): the second half of release registration. The
      # build step above created the release and attached its source maps;
      # this records that the release actually reached the hosted environment,
      # which is what makes Sentry's "first seen in" and regression detection
      # line up with real deploys instead of with build times.
      #
      # Deliberately after the deploy and before the smoke test: a deploy that
      # never shipped must not be marked as deployed, and a smoke-test failure
      # should still leave the release marked (it did ship; it is broken).
      # `sentry-cli` comes from @sentry/vite-plugin's own dependency, so there
      # is nothing extra to install. No-ops when the Sentry values are unset.
      - name: Mark the release as deployed in Sentry
        if: ${{ vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' }}
        run: bunx sentry-cli releases deploys "$SENTRY_RELEASE" new --env alpha
        env:
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Install Playwright browser (chromium) for the post-deploy smoke test
        run: bunx playwright install --with-deps chromium
      # PRD OPS-01: "a deployed build is smoke-tested against the hosted
      # environment ... and a failed smoke test is treated as a failed
      # deploy." This step runs after `firebase deploy` succeeds and before
      # the job is considered successful, so a failure here fails the
      # workflow -- there is no separate "mark the deploy failed" step needed.
      - name: Post-deploy smoke test against the hosted URL
        run: bun run smoke:hosted
        env:
          SMOKE_URL: https://${{ vars.FIREBASE_PROJECT_ID }}.web.app
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: hosted-smoke-test-report
          path: playwright-report/
          retention-days: 7
