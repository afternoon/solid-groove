name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # `assigned` is deliberately absent. The gate below can only match `@claude`
  # in the issue body or title, and assigning an issue changes neither, so
  # listening for it produced a trigger that could never fire — you assign the
  # issue and wait on silence. Tag `@claude` in a comment instead. Reinstating
  # assignment-to-run means gating on `github.event.assignee.login`, which is a
  # deliberate change, not a missing `types` entry.
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history, not a depth-1 clone. An implementation run has to
          # branch from `main`, and a task whose dependency landed on another
          # branch needs a real merge base to rebase or merge against. A
          # shallow clone has no merge base to find, and the failure surfaces
          # as a confusing git error partway through the run rather than at
          # checkout.
          fetch-depth: 0

      # Bun + null ALSA device. See the composite action for why the audio
      # device is mandatory, not convenience.
      - uses: ./.github/actions/claude-env

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          # Allow @claude on bot-authored PRs/comments too (e.g. a Claude-opened
          # PR), which the action otherwise blocks as a "non-human actor".
          allowed_bots: "*"
          # Without an explicit --allowedTools, this action does NOT grant
          # arbitrary Bash: only base tools (read-only git, file ops) run, so
          # every `bun`/`tsc`/`node` command a task needs is blocked with "This
          # command requires approval" and no way to approve it in a headless
          # run (see issue #43's 2026-07-31 comment). Enumerate the command
          # prefixes the repo's tasks actually use, keeping bare `Bash` too.
          claude_args: |
            --model opus
            --max-turns 120
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,LS,TodoWrite,NotebookEdit,WebFetch,WebSearch,Bash,Bash(bun:*),Bash(bunx:*),Bash(node:*),Bash(npx:*),Bash(tsc:*),Bash(git:*),Bash(gh:*),Bash(ls:*),Bash(cat:*),Bash(cp:*),Bash(mv:*),Bash(mkdir:*),Bash(rm:*),Bash(echo:*),Bash(grep:*),Bash(find:*),Bash(sed:*),Bash(chmod:*)"
