name: Merge

# Lands PRs through the merge queue (`.github/scripts/merge.mjs`):
#
#  - a safe PR (no gated path) is queued as soon as it sits on main and is not a
#    draft or labelled `hold`: when it opens, is pushed, or restack moves it onto
#    main because the PR under it merged
#  - a gated PR is labelled `needs-approval` and waits; adding `status:approved`
#    to its issue (the board's Approved column) approves every open PR for the
#    issue and the PRs stacked under them, and adding it to one PR approves that
#    PR and the PRs under it
#
# Queue failures go back to the agent through ci-failure.yml. A push to an
# approved PR re-queues it without a new approval; remove the label to stop that.
on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, reopened, ready_for_review, labeled, unlabeled, edited, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  merge:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'status:approved' && !github.event.issue.pull_request) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (
        (github.event.action == 'labeled' && github.event.label.name == 'status:approved') ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'hold') ||
        (github.event.action == 'edited' && github.event.changes.base != null) ||
        contains(fromJSON('["opened", "reopened", "ready_for_review", "synchronize"]'), github.event.action)
      ))
    runs-on: ubuntu-latest
    # One run per issue or PR at a time, never cancelled. Not one group for the
    # whole repo: GitHub keeps only the newest pending run in a group and
    # cancels the rest, so when several PRs moved at once, every approval but
    # the last was dropped and those PRs were never queued.
    concurrency:
      group: merge-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      # Not GITHUB_TOKEN: a merge made by it triggers no workflows, so `main`
      # would get no CI and no deploy.
      GH_TOKEN: ${{ secrets.RESTACK_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - env:
          MODE: ${{ github.event_name == 'issues' && 'issue' || (github.event.action == 'labeled' && 'pr' || 'sync') }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: node .github/scripts/merge.mjs "$MODE" "$NUMBER"
