name: Milestone

# Every new issue gets a milestone. A bug goes on the milestone of the area it
# is in (a library bug on the milestone the library is built in, an export bug
# on the export milestone, sign-in or accessibility on hardening), which takes
# judgement, so a short Claude run picks it. Anything else (a feature or an
# enhancement) goes on Post-Alpha. An issue that already has a milestone, or is
# the Board, is left alone.
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  milestone:
    if: >-
      github.event.issue.milestone == null &&
      !contains(github.event.issue.labels.*.name, 'board') && (
        github.event.action == 'opened' ||
        github.event.label.name == 'bug'
      )
    runs-on: ubuntu-latest
    concurrency:
      group: milestone-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.RESTACK_TOKEN || github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - name: Is it a bug?
        id: kind
        env:
          TITLE: ${{ github.event.issue.title }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ' ') }}
        run: |
          if [[ " $LABELS " == *" bug "* ]] || [[ "${TITLE,,}" =~ ^bug([^a-z]|$) ]]; then
            echo "bug=true" >> "$GITHUB_OUTPUT"
          else
            echo "bug=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Put a feature on Post-Alpha
        if: steps.kind.outputs.bug == 'false'
        run: |
          # The event's milestone is a snapshot: another run may have set one since.
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq '.milestone.number // empty')" ]; then
            echo "Already has a milestone."; exit 0
          fi
          m=$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=open&per_page=100" \
            --jq '[.[] | select(.title == "Post-Alpha")][0].number')
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$ISSUE" -F milestone="$m" --jq '"#\(.number) -> \(.milestone.title)"'

      - uses: actions/checkout@v4
        if: steps.kind.outputs.bug == 'true'
        with:
          sparse-checkout: CLAUDE.md
      - name: Put a bug on the milestone of its area
        if: steps.kind.outputs.bug == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.RESTACK_TOKEN || github.token }}
          prompt: |
            GitHub issue #${{ github.event.issue.number }} in ${{ github.repository }} is a bug with no milestone. Give it the milestone of the area it is in. Do nothing else: no comments, no labels, no other edits.

            1. Read the issue: `gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}`. If it now has a milestone, stop.
            2. List the open milestones (`gh api "repos/${{ github.repository }}/milestones?state=open"`) and, for each, the titles of its issues, open and closed (`gh api "repos/${{ github.repository }}/issues?milestone=<number>&state=all&per_page=100" --jq '.[].title'`), to see which area each one covers.
            3. Pick the milestone whose area the bug is in: the one where the feature it breaks was built or is being built. Sign-in, accounts, onboarding, accessibility, cross-browser, security, performance and reliability bugs belong to the hardening milestone unless they are plainly part of another milestone's feature. Never put a bug on Post-Alpha unless the feature it breaks is itself a Post-Alpha feature. If nothing fits, use the hardening milestone.
            4. Set it: `gh api -X PATCH repos/${{ github.repository }}/issues/${{ github.event.issue.number }} -F milestone=<number>`.
          claude_args: |
            --model sonnet
            --max-turns 15
            --allowedTools "Bash(gh api:*)"
