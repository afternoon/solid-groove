name: Restack

# Keeps stacked PRs mergeable while the PRs under them move. See
# `.github/scripts/restack.sh` for exactly what each event does; in short:
#
#  - a PR merges            -> PRs stacked on it are retargeted to its base and
#                              rebased onto it
#  - a PR's branch is pushed -> PRs stacked on it are rebased onto it
#  - a PR's base is changed  -> it is rebased onto its new base
#  - main moves              -> every open PR on main that now conflicts with
#                              it is rebased onto it (one that still merges
#                              cleanly is left alone)
#  - run by hand with `all`  -> every open PR on main, and every stack on them,
#                              is rebased onto main, conflicting or not
#
# It rebases and force-pushes with a lease, because GitHub's native stacks
# (stack-link.yml) only merge with a linear history. It moves only each PR's
# own commits. A conflict is labelled `restack-conflict` and handed to @claude.
#
# RESTACK_TOKEN: a fine-grained PAT (this repo; Contents, Pull requests and
# Issues read/write). Optional, but without it this falls back to GITHUB_TOKEN,
# and GitHub deliberately triggers no workflows from GITHUB_TOKEN activity: the
# restacked branches would get no CI run, and the @claude conflict comment would
# not start claude.yml.
on:
  pull_request:
    types: [closed, synchronize, edited]
  push:
    branches: [main]
  # Rebase whatever on main conflicts, without waiting for main to move. With
  # `all`, rebase every open PR and stack, so a fix on main reaches every PR's
  # CI (a stacked PR's CI never sees main until its stack is rebased).
  workflow_dispatch:
    inputs:
      all:
        description: Rebase every open PR and stack onto main, not just the ones that conflict
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  restack:
    # Forks have no write access here, and nothing in this repo stacks on one.
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository && (
        (github.event.action == 'closed' && github.event.pull_request.merged) ||
        github.event.action == 'synchronize' ||
        (github.event.action == 'edited' && github.event.changes.base != null)
      )
    runs-on: ubuntu-latest
    # Serialise per PR, never cancel: a cancelled run can leave a stack half
    # updated, and the next event may not come.
    concurrency:
      group: restack-${{ github.event.pull_request.number || github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.RESTACK_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RESTACK_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config user.name "groove-restack[bot]"
          git config user.email "groove-restack@users.noreply.github.com"

      - name: Restack
        env:
          ACTION: ${{ inputs.all && 'all' || (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'push' || github.event.action }}
          PR: ${{ github.event.pull_request.number || github.ref_name }}
          BEFORE: ${{ github.event.before }}
          OLD_BASE: ${{ github.event.changes.base.ref.from }}
        run: |
          case "$ACTION" in
            closed) mode=merged; extra="" ;;
            synchronize) mode=pushed; extra="$BEFORE" ;;
            edited) mode=rebased; extra="$OLD_BASE" ;;
            push) mode=base; extra="" ;;
            all) mode=all; extra="" ;;
          esac
          # Run a copy: the script checks out other branches as it goes, and bash
          # reads a script lazily, so it must not change underneath itself.
          cp .github/scripts/restack.sh "$RUNNER_TEMP/restack.sh"
          bash "$RUNNER_TEMP/restack.sh" "$mode" "$PR" $extra
