name: Stack link

# Links stacked PRs into one of GitHub's native stacks, so the PR page shows the
# stack and it merges bottom-up from there. Agents stack PRs the plain way (each
# PR's base is the previous PR's branch, `gh pr create --base`); this finds the
# chain a PR sits in and creates the stack, or appends to it, over REST. See
# `.github/scripts/stack-link.mjs`. restack.yml keeps the stack linear, which a
# native stack needs before it can merge.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, edited]
  # Link a stack that predates this workflow: give any PR in it.
  workflow_dispatch:
    inputs:
      pr:
        description: Any PR in the stack
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  link:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.pull_request.head.repo.full_name == github.repository && (
          github.event.action != 'edited' || github.event.changes.base != null
        )
      )
    runs-on: ubuntu-latest
    # One link at a time: two PRs of one stack opening together would race to
    # create it twice.
    concurrency:
      group: stack-link
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.RESTACK_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - env:
          PR: ${{ inputs.pr || github.event.pull_request.number }}
        run: node .github/scripts/stack-link.mjs "$PR"
